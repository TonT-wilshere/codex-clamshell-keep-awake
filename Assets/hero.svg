<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">合盖工作 · Clamshell Awake</title>
  <desc id="desc">让 Codex 和其他 AI 编程任务在 MacBook 合盖后继续运行</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="0.55" stop-color="#102a57"/>
      <stop offset="1" stop-color="#0d5a6b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="32" fill="url(#bg)"/>
  <circle cx="1040" cy="85" r="160" fill="#22d3ee" opacity="0.08"/>
  <circle cx="110" cy="430" r="190" fill="#2563eb" opacity="0.11"/>

  <g transform="translate(92 95)">
    <rect x="0" y="0" width="332" height="220" rx="19" fill="#dbeafe" opacity="0.96"/>
    <rect x="17" y="17" width="298" height="184" rx="9" fill="url(#screen)"/>
    <path d="M-32 236h396l-25 30H-7z" fill="#f8fafc"/>
    <path d="M142 67l-38 75h46l-13 66 82-100h-52l27-41z" fill="#fff" filter="url(#glow)"/>
    <circle cx="292" cy="43" r="12" fill="#4ade80"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#fff">
    <text x="505" y="153" font-size="56" font-weight="750">合盖工作</text>
    <text x="505" y="210" font-size="28" font-weight="600" fill="#a5f3fc">Clamshell Awake</text>
    <text x="505" y="274" font-size="26" fill="#dbeafe">合上 MacBook，AI 编程任务继续跑</text>
    <g transform="translate(505 326)" font-size="18" font-weight="600">
      <rect width="156" height="44" rx="22" fill="#1d4ed8"/><text x="22" y="29">Codex Ready</text>
      <rect x="170" width="144" height="44" rx="22" fill="#0f766e"/><text x="193" y="29">10% 保护</text>
      <rect x="328" width="168" height="44" rx="22" fill="#6d28d9"/><text x="351" y="29">中英双语</text>
    </g>
  </g>
</svg>
